<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla callback</title>
<style>body{font-family:sans-serif;text-align:center;padding:2em}#c{font-size:1.6em;word-break:break-all;background:#eee;padding:1em;border-radius:8px}button{font-size:1.5em;padding:.5em 2em;margin-top:1em}</style></head>
<body><h1>Tesla authorization code</h1><div id="c"></div><button id="b">Copy</button><p id="m"></p>
<script>
var p=new URLSearchParams(location.search);var code=p.get('code');var err=p.get('error');
document.getElementById('c').textContent=code||('No code. '+(err?('Error: '+err+' '+(p.get('error_description')||'')):''));
document.getElementById('b').onclick=function(){navigator.clipboard.writeText(code||'').then(function(){document.getElementById('m').textContent='Copied!'});};
</script></body></html>
